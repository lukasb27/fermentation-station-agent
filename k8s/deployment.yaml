apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fermentation-station-agent
    backstage.io/kubernetes-id: fermentation-station-agent
  name: fermentation-station-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fermentation-station-agent
  template:
    metadata:
      labels:
        app: fermentation-station-agent
        backstage.io/kubernetes-id: fermentation-station-agent
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: lukasball/fermentation-station-agent:latest
        name: fermentation-station-agent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}

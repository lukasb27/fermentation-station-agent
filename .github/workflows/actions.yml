name: CI
on: pull_request

permissions:
  pull-requests: write

env:
  APP_NAME: fermentation-station-agent

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v4
        with:
            python-version: '3.13'
        # see details (matrix, python-version, python-version-file, etc.)
        # https://github.com/actions/setup-python
      - name: Install poetry
        uses: abatilo/actions-poetry@v4
      - name: Setup a local virtual environment (if no poetry.toml file)
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - uses: actions/cache@v3
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
      - name: Install tox and any other packages
        run: pip install tox
      - name: Run Tox
        run: tox
      - name: Get Cover 
        uses: orgoro/coverage@v3.2
        with:
            coverageFile: coverage_data.xml
            token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ephemeral-environment-setup:
    runs-on: ubuntu-latest
    needs: ci  
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          path: fermentation-station-agent
      - name: check out argo cd control repo
        uses: actions/checkout@v4
        with:
          repository: lukasb27/fermentation-station-argocd-control
          token: ${{ secrets.ARGO_CD_REPO_TOKEN }}
          path: fermentation-station-argocd-control
      - name: Install Python
        uses: actions/setup-python@v4
        with:
            python-version: '3.13'
        # see details (matrix, python-version, python-version-file, etc.)
        # https://github.com/actions/setup-python
      - name: Install jinja2
        run: pip install jinja2
      - name: Wait for Docker images to be pushed
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          ENCODED_TAG=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${BRANCH}")

          for IMAGE in lukasball/fermentation-station-agent lukasball/fermentation-station-agent-integ-tests; do
            echo "Waiting for ${IMAGE}:${BRANCH} to appear on Docker Hub (built by docker.yml off the same push)..."
            FOUND=0
            for i in $(seq 1 40); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${ENCODED_TAG}")
              if [ "${STATUS}" = "200" ]; then
                echo "Found ${IMAGE}:${BRANCH} on Docker Hub."
                FOUND=1
                break
              fi
              echo "Attempt ${i}/40: not available yet (HTTP ${STATUS}). Retrying in 15s..."
              sleep 15
            done
            if [ "${FOUND}" -ne 1 ]; then
              echo "Timed out waiting for ${IMAGE}:${BRANCH} to be pushed to Docker Hub." >&2
              exit 1
            fi
          done
      - name: Run YAML generator
        env:
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_SLUG: ${{ github.repository }}
        run: python3 fermentation-station-agent/utils/argo_app_writer.py
      - name: Copy YAML file to new repo and push
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH_SLUG=$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr -cd 'a-z0-9-')
          FULL_NAME="${APP_NAME}-${BRANCH_SLUG}"
          FULL_NAME="${FULL_NAME:0:63}"

          cp "${FULL_NAME}.yaml" "fermentation-station-argocd-control/apps/${FULL_NAME}.yaml"

          # Move into the external repo directory to perform Git operations
          cd fermentation-station-argocd-control

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "apps/${FULL_NAME}.yaml"

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add ArgoCD application for PR ${PR_NUMBER} (Branch: ${BRANCH_NAME})"
            git push
          fi
